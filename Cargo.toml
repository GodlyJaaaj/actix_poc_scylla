[package]
name = "actix_poc_scylla"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.10.2"
actix-cors = "0.7.1"
actix-session = { version = "0.10.1", features = ["redis-session"] }
actix-identity = "0.8.0"
diesel = { version = "2.2.8", features = [
    "postgres_backend",
    "postgres",
    "uuid",
    "r2d2",
    "chrono",
    "serde_json",
] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.78"
env_logger = "0.11.7"
utoipa-swagger-ui = { version = "9.0.0", features = ["actix-web"] }
utoipa = { version = "5.3.1", features = ["actix_extras", "uuid", "chrono"] }
bcrypt = "0.17.0"
chrono = { version = "0.4.40", features = ["serde"] }
validator = { version = "0.20.0", features = ["derive"] }
thiserror = "2.0.12"
log = "0.4.26"
regex = "1.11.1"
lettre = "0.11.15"
lettre_email = "0.9.4"
rand = "0.9.0"
toml = "0.8.20"
actix-multipart = "0.7.2"
futures = "0.3.31"
sanitize-filename = "0.6.0"
tokio = { version = "1.44.1", features = ["fs"] }
mime = "0.3.17"
actix-files = "0.6.6"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"